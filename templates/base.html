<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard Project{% endblock %} · {{ brand_nama }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <img class="logo-mark" src="{{ url_for('static', filename='img/favicon.svg') }}" alt="">
        <div>
          <div class="logo-title">Dashboard Project</div>
          <div class="logo-sub">PT Allure Alluminio</div>
        </div>
      </div>
      <div class="brand-pill">Brand: <strong>{{ brand_nama }}</strong></div>
      <nav class="nav">
        <a href="/project" class="nav-item {% if active == 'project' %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg><span>Project</span>
        </a>
        <a href="/omzet" class="nav-item {% if active == 'omzet' %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Omzet</span>
        </a>
        <a href="/penagihan-fg" class="nav-item {% if active == 'penagihan' %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Penagihan FG</span>
        </a>
      </nav>
      <div class="sync-info" id="sync-info">Memuat info sync…</div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
