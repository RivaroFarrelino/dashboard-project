{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Penagihan FG</h1>
    <p class="muted">Centang barang jadi (FG) yang sudah ditagih. Centang bisa dibatalkan kapan saja.</p>
  </div>
</header>

<section id="pesan" class="alert" hidden></section>

<div class="filter-bar card">
  <div class="search search-sm">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="f-cari" type="search" placeholder="Cari SO, project, customer, item, FPPP, kode opening/unit">
  </div>
  <div class="segmen" id="f-status" role="tablist">
    <button data-v="belum" class="aktif">Belum ditagih</button>
    <button data-v="sudah">Sudah ditagih</button>
    <button data-v="semua">Semua</button>
  </div>
  <label class="select-wrap inline">
    <span class="muted small">FPPP selesai</span>
    <select id="f-periode">
      <option value="30">30 hari terakhir</option>
      <option value="90" selected>90 hari terakhir</option>
      <option value="180">180 hari terakhir</option>
      <option value="tahun">Tahun ini</option>
      <option value="semua">Semua</option>
    </select>
  </label>
</div>

<div class="kpi-grid kpi-3">
  <div class="card kpi"><div class="kpi-label">Item FG siap tagih</div><div class="kpi-value" id="k-fg">–</div><div class="kpi-sub" id="k-fg-sub"></div></div>
  <div class="card kpi"><div class="kpi-label">Sudah ditagih</div><div class="kpi-value" id="k-tagih">–</div><div class="kpi-sub" id="k-tagih-sub"></div><div class="bar"><span id="k-tagih-bar"></span></div></div>
  <div class="card kpi"><div class="kpi-label">Belum ditagih</div><div class="kpi-value" id="k-belum">–</div><div class="kpi-sub" id="k-belum-sub"></div></div>
</div>

<div class="card">
  <div class="card-head">
    <h3 id="judul-tabel">Daftar FG</h3>
  </div>
  <div class="fg-list" id="tbl-fg"></div>
  <div class="pager">
    <span class="muted small" id="info-halaman"></span>
    <div class="toolbar">
      <button class="btn-sm" id="btn-prev">‹ Sebelumnya</button>
      <button class="btn-sm" id="btn-next">Berikutnya ›</button>
    </div>
  </div>
</div>

<div class="modal" id="m-tagih" hidden>
  <div class="modal-box modal-tagih" role="dialog" aria-modal="true" aria-labelledby="m-tagih-judul">
    <div class="modal-head">
      <div>
        <h3 id="m-tagih-judul">Konfirmasi Penagihan</h3>
      </div>
      <button class="btn-icon" data-tutup-tagih aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body" id="m-tagih-isi"><div class="loading">Menghitung nominal…</div></div>
    <div class="modal-foot">
      <label class="tagih-total"><span class="muted small">Total ditagih</span><input class="input-nominal input-total" id="m-tagih-total" inputmode="numeric" aria-label="Total ditagih"></label>
      <div class="modal-aksi">
        <button type="button" class="btn" data-tutup-tagih>Batal</button>
        <button type="button" class="btn-utama btn-utama-auto" id="m-tagih-simpan" disabled>Simpan tagihan</button>
      </div>
    </div>
  </div>
</div>

<div class="aksi-bar" id="aksi-bar" hidden>
  <div class="aksi-info">
    <b id="info-pilih"></b>
    <span id="info-nilai"></span>
  </div>
  <button type="button" class="aksi-kosong" id="btn-kosong">Batal pilih</button>
  <button type="button" class="aksi-btn aksi-btn-garis" id="btn-batal">Batalkan tagih</button>
  <button type="button" class="aksi-btn" id="btn-tandai">Lanjut konfirmasi<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

<div class="toast" id="toast" hidden></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/penagihan.js', v=aset_v) }}"></script>
{% endblock %}
